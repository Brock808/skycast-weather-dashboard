<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <p class="d-flex justify-content-center pt-3">Future live clock</p>
      <div class="container">
        <div
          id="hudSkyCast"
          class="d-flex justify-content-between align-items-center p-3 mt-4"
        >
          <img
            src="logo/skycast-small-icon.png"
            alt="smaillIcon"
            class="iconSmall"
          />
          <h1>SkyCast</h1>
          <form class="input-group px-4" style="max-width: 900px">
            <input
              type="search"
              class="form-control"
              placeholder="Search city..."
            />
            <button id="btnSearch" class="searchButton btn">Search</button>
          </form>
          <button id="btnChangeGrades" class="btn positiveButton">
            °C / °F
          </button>
        </div>
      </div>
    </header>
    <main>
      <div class="container mt-3">
        <div class="row g-0 justify-content-between">
          <!-- Favourites -->
          <div class="col-12 col-md-3 card align-items-center p-2">
            <h2>Favourites</h2>
            <ul id="favouriteList"></ul>
          </div>
          <!-- Main display -->
          <div class="col-12 col-md-9 d-flex flex-column gap-3 ps-4">
            <!-- Divided in two -->
            <!-- Actual position -->
            <section class="mainCard p-2">
              <div class="d-flex justify-content-between px-4">
                <h2 id="updateCity">Here is the city</h2>
                <button class="btn positiveButton">
                  <i class="bi bi-star-fill"></i> Save
                </button>
              </div>
              <div
                class="d-flex pt-2 justify-content-around align-items-center"
              >
                <div class="text-center">
                  <p id="currentWetherNumber" class="display-1 mx-auto">4"</p>
                  <p id="currentWetherText" class="secondaryText">
                    current weather
                  </p>
                  <p class="secondaryText">
                    Last update:<span id="lastUpdate"></span>
                  </p>
                </div>
                <div>
                  <p class="secondaryText">
                    Feels like:<span id="feelsLike"></span>
                  </p>
                  <p class="secondaryText">
                    Humidity:<span id="humidity"></span>
                  </p>
                  <p class="secondaryText">Wind:<span id="wind"></span></p>
                </div>
              </div>
            </section>

            <!-- Next 7 days -->
            <section class="card p-2">
              <h2>Next 7 days:</h2>
              <div id="nextDaysRow" class="row"></div>
            </section>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <hr />
      <div class="container d-flex justify-content-center align-items-center">
        <img
          class="largeIcon"
          src="logo/skycast-large-icon.png"
          alt="footerIcon"
        />
        <p class="secondaryText">
          First proyect with API by Marcos Cattaneo student at Noroff Norway
        </p>
      </div>
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <!-- JavaScript File -->
    <script src="js/weather_skycast.js"></script>
  </body>
</html>
